name: hourly

# C10: ingest RealtimeTotals + Adequacy3, archive the live weather snapshot, forecast the current
# issue hour (with honest catch-up of missed hours), publish latest/*.json. CLI: gridcast run hourly.
#
# Cron slots (ADR-0012): :02, :12, :22. GitHub starts scheduled runs 15-25+ min late and drops
# some slots outright, so three slots per hour, the first as early as the inputs allow: a complete
# RealtimeTotals hour lands at :53-:57 of the hour it covers, so at :02 the L0 hour
# (issue - REALTIME_LAG_H = 1 h) is in. Success is judged per issue hour: the first run that
# writes the hour's 24 champion rows marks it `ok`; later slots for the same hour are `skipped`
# and ping success (they still ingest Adequacy3 reissues). A run that starts after data_cutoff
# (issue + 30 min) forecasts honestly from the previous slot's snapshot; it is never better.
on:
  schedule:
    - cron: "2,12,22 * * * *"
  workflow_dispatch:
    inputs:
      issue_time:
        description: "Issue hour, UTC (e.g. 2026-10-24T15:00:00). Empty = the current hour."
        required: false
        default: ""

permissions: {}

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OBJSTORE_ENDPOINT_URL: ${{ secrets.OBJSTORE_ENDPOINT_URL }}
      OBJSTORE_REGION: ${{ secrets.OBJSTORE_REGION }}
      OBJSTORE_ACCESS_KEY_ID: ${{ secrets.OBJSTORE_ACCESS_KEY_ID }}
      OBJSTORE_SECRET_ACCESS_KEY: ${{ secrets.OBJSTORE_SECRET_ACCESS_KEY }}
      OBJSTORE_BUCKET_PRIVATE: ${{ secrets.OBJSTORE_BUCKET_PRIVATE }}
      OBJSTORE_BUCKET_PUBLIC: ${{ secrets.OBJSTORE_BUCKET_PUBLIC }}
      # Optional: unset = no heartbeat.
      HEALTHCHECKS_HOURLY_URL: ${{ secrets.HEALTHCHECKS_HOURLY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.11 and runtime dependencies
        run: |
          uv python install 3.11
          uv sync --locked --no-dev

      - name: gridcast run hourly
        env:
          ISSUE_TIME: ${{ inputs.issue_time }}
          RUN_KIND: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: |
          args=(--run-kind "$RUN_KIND")
          if [ -n "$ISSUE_TIME" ]; then args+=(--issue-time "$ISSUE_TIME"); fi
          uv run --no-sync gridcast run hourly "${args[@]}"

      # Plan §6.1 step 9b: probe the public API (the Cloudflare Worker, ADR-0011) and ping its own
      # Healthchecks check. Skipped until the repository variable PUBLIC_API_URL is set (owner, after
      # the Worker is deployed); never affects the forecast run's status.
      - name: Public API probe
        if: always() && vars.PUBLIC_API_URL != ''
        continue-on-error: true
        env:
          API: ${{ vars.PUBLIC_API_URL }}
          HC: ${{ secrets.HEALTHCHECKS_API_URL }}
        run: |
          ok=0
          body=$(curl -fsS -m 60 "${API%/}/health") && echo "$body" | grep -q '"stale":false' && ok=1
          echo "health: ${body:0:300}"
          if [ -n "$HC" ]; then
            suffix=""; [ "$ok" = 1 ] || suffix="/fail"
            curl -fsS -m 10 -o /dev/null "${HC%/}${suffix}" || true
          fi
          [ "$ok" = 1 ]
