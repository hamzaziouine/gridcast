name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gridcast
          POSTGRES_PASSWORD: gridcast
          POSTGRES_DB: gridcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests run against the service container; unit tests ignore it.
      DATABASE_URL: postgresql+psycopg://gridcast:gridcast@localhost:5432/gridcast
      DATABASE_URL_DIRECT: postgresql+psycopg://gridcast:gridcast@localhost:5432/gridcast
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.11 and dependencies
        run: |
          uv python install 3.11
          uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format check)
        run: uv run ruff format --check

      - name: Mypy (strict on src)
        run: uv run mypy src

      - name: Pytest (unit + integration)
        run: uv run pytest

      - name: Every workflow secret/var is listed in .env.example
        run: |
          missing=0
          for name in $(grep -rhoE '(secrets|vars)\.[A-Z_][A-Z0-9_]*' .github/workflows | sed -E 's/^(secrets|vars)\.//' | sort -u); do
            if [ "$name" = "GITHUB_TOKEN" ]; then continue; fi
            if ! grep -qE "^${name}=" .env.example; then
              echo "::error::${name} is used in a workflow but missing from .env.example"
              missing=1
            fi
          done
          exit $missing
