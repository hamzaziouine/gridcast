name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gridcast
          POSTGRES_PASSWORD: gridcast
          POSTGRES_DB: gridcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create and drop their own databases on the service container.
      # They read GRIDCAST_TEST_DATABASE_URL (never DATABASE_URL) so a real Neon URL is never touched.
      GRIDCAST_TEST_DATABASE_URL: postgresql+psycopg://gridcast:gridcast@localhost:5432/gridcast
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.11 and dependencies
        run: |
          uv python install 3.11
          uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format check)
        run: uv run ruff format --check

      - name: Mypy (strict on src)
        run: uv run mypy src

      - name: Pytest (unit + integration)
        run: uv run pytest

      - name: Worker tests (node:test, fake R2 binding; no install needed)
        working-directory: infra/worker
        run: node --test

      - name: Every workflow secret/var is listed in .env.example
        run: |
          missing=0
          for name in $(grep -rhoE '(secrets|vars)\.[A-Z_][A-Z0-9_]*' .github/workflows | sed -E 's/^(secrets|vars)\.//' | sort -u); do
            if [ "$name" = "GITHUB_TOKEN" ]; then continue; fi
            if ! grep -qE "^${name}=" .env.example; then
              echo "::error::${name} is used in a workflow but missing from .env.example"
              missing=1
            fi
          done
          exit $missing

  # C15: README "Run it locally" from a fresh clone with empty uv caches and no services
  # (integration tests on the embedded Postgres) must be green in < 15 min.
  fresh-clone:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/fresh_clone_check.sh
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Fresh clone -> CLI + test suite (limit 900 s)
        env:
          REF: ${{ github.ref_name }}
        run: bash scripts/fresh_clone_check.sh "https://github.com/$GITHUB_REPOSITORY.git" "$REF"
