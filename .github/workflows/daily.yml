name: daily

# C11: PUB_Demand ingest (revisions) -> score every prediction whose final actual landed ->
# peak_hours -> score_daily -> drift signals -> latest/scoreboard.json. CLI: gridcast run daily.
#
# 13:20Z = 08:20 EST, ~50 min after IESO's 07:30 EST PUB_Demand update; 18:20Z is the second
# chance for a late file (the first slot ends `skipped`, not `ok`, while yesterday HE24 is
# missing). A drift trigger (7-day MAPE > 1.5 x reference for 3 days, >= 7 live days, no retrain
# in 72 h; ADR-0013) dispatches retrain.yml with reason drift:mape: the only reason this job has
# `actions: write`. The separate `status` job (ADR-0015) is the only one with `contents: write`: it
# force-pushes generated files to the orphan `status` branch and never touches main.
on:
  schedule:
    - cron: "20 13 * * *"
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      scheduler:
        description: "Set by the Cloudflare Worker cron (ADR-0014): 'cloudflare' = a scheduled run."
        required: false
        default: ""
      date:
        description: "EST date YYYY-MM-DD the run is for. Empty = today (EST)."
        required: false
        default: ""

permissions: {}

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # gh workflow run retrain.yml on a drift trigger
    outputs:
      status_built: ${{ steps.status.outcome == 'success' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OBJSTORE_ENDPOINT_URL: ${{ secrets.OBJSTORE_ENDPOINT_URL }}
      OBJSTORE_REGION: ${{ secrets.OBJSTORE_REGION }}
      OBJSTORE_ACCESS_KEY_ID: ${{ secrets.OBJSTORE_ACCESS_KEY_ID }}
      OBJSTORE_SECRET_ACCESS_KEY: ${{ secrets.OBJSTORE_SECRET_ACCESS_KEY }}
      OBJSTORE_BUCKET_PRIVATE: ${{ secrets.OBJSTORE_BUCKET_PRIVATE }}
      OBJSTORE_BUCKET_PUBLIC: ${{ secrets.OBJSTORE_BUCKET_PUBLIC }}
      # Optional: unset = no heartbeat.
      HEALTHCHECKS_DAILY_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.11 and runtime dependencies
        run: |
          uv python install 3.11
          uv sync --locked --no-dev

      - name: gridcast run daily
        id: daily
        env:
          RUN_DATE: ${{ inputs.date }}
          RUN_KIND: ${{ (github.event_name == 'schedule' || inputs.scheduler == 'cloudflare') && 'scheduled' || 'manual' }}
        run: |
          args=(--run-kind "$RUN_KIND")
          if [ -n "$RUN_DATE" ]; then args+=(--date "$RUN_DATE"); fi
          uv run --no-sync gridcast run daily "${args[@]}"

      - name: Dispatch retrain.yml on a drift trigger
        if: steps.daily.outputs.retrain_reason != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.daily.outputs.retrain_reason }}
        run: gh workflow run retrain.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="$REASON"

      # C15 (ADR-0015): chart_7d.svg + metrics.json + a mirror of latest/*.json. Built here (this
      # job has the read credentials), pushed by the `status` job (which has contents: write and
      # no other secret). A failure here never changes the daily run's status or heartbeat.
      - name: Status files
        id: status
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uv run --no-sync gridcast status build --out status_out

      - name: Upload status files
        if: ${{ !cancelled() && steps.status.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: status
          path: status_out/
          retention-days: 3
          if-no-files-found: error

  status:
    needs: daily
    if: ${{ !cancelled() && needs.daily.outputs.status_built == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # force-push the orphan `status` branch; nothing else is pushed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: status
          path: status_out

      - name: Force-push the orphan status branch (one commit, generated files only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        working-directory: status_out
        run: |
          set -euo pipefail
          git init -q -b status
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "status: $(date -u +%Y-%m-%dT%H:%MZ) (daily run $GITHUB_RUN_ID)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/status
          git log --oneline -1
