<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="ttl dsc">
<title id="ttl">GridCast: day-ahead forecasts vs final actuals, last 7 days</title>
<desc id="dsc">Ontario Demand in MW, hourly, from 2026-11-07 18:00Z to 2026-11-15 18:00Z. GridCast p50 with 80% band, IESO, and the same hour yesterday baseline, each issued 24 hours ahead, against final IESO actuals.</desc>
