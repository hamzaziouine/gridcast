<title id="ttl">GridCast: day-ahead forecasts vs final actuals, last 7 days</title>
<desc id="dsc">Ontario Demand in MW, hourly, from 2026-11-14 13:00Z to 2026-11-22 13:00Z. GridCast p50 with 80% band, IESO, and the same hour yesterday baseline, each issued 24 hours ahead, against final IESO actuals.</desc>
