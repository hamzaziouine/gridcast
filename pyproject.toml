[project]
name = "gridcast"
version = "0.1.0"
description = "Ontario electricity demand forecaster with a public scoreboard against IESO and naive baselines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hamza Ziouine", email = "hamzaziouine.23@gmail.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "tenacity>=8.5",
    "tzdata>=2024.1",
]

[project.scripts]
gridcast = "gridcast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "pgserver>=0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["gridcast"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a real Postgres (DATABASE_URL or the embedded pgserver)",
]
