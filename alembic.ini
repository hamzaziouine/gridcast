# Alembic configuration. The database URL is NOT stored here: alembic/env.py reads
# DATABASE_URL_DIRECT (falling back to DATABASE_URL), or a URL passed programmatically
# by `gridcast db upgrade` / the integration tests.
[alembic]
script_location = %(here)s/alembic
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
